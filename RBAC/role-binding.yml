kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: service-user-rolebinding
  namespace: jenkins
subjects:
- kind: ServiceAccount
  name: jenkins-user
  namespace: jenkins
  apiGroup: ""
roleRef:
  kind: Role
  name: jenkins-role
  apiGroup: rbac.authorization.k8s.io