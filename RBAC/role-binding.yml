kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: dev-user-rolebinding
  namespace: three-tier
subjects:
- kind: ServiceAccount
  name: dev-user
  namespace: three-tier
  apiGroup: rbac.authorization.k8s.io/v1
roleRef:
  kind: Role
  name: dev-role
  apiGroup: rbac.authorization.k8s.io