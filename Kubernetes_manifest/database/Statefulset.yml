apiVersion: apps/v1
kind: StatefulSet
metadata:
  name:  db-statefulset
  namespace: three-tier
spec:
  serviceName: mongo-service
  replicas: 1
  selector:
    matchLabels:
      app : mongodb
   
  template:
    metadata:
      labels:
        app:  mongodb
    spec:
      containers:
      - image: mongo:6
        name:  mongo-db-image

        ports:
        - containerPort:  27017
          name:  mongodb-port
          imagePullPolicy: IfNotPresent

        env:
        - name:  MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name : mongo-secret
              key : username 

        - name:  MONGO_INITDB_ROOT_PASSWORD 
          valueFrom:
            secretKeyRef:
              name : mongo-secret
              key : password

        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits: 
             cpu: "500m"
             memory: "1Gi"

        livenessProbe:
          exec:
            command:
              - mongosh
              - --eval
              - "db.adminCommand('ping')"
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
              - mongosh
              - --eval
              - "db.adminCommand('ping')"
          initialDelaySeconds: 10
          periodSeconds: 10
          
        volumeMounts:
          - name:  mongo-data
            mountPath:  /data/db

volumeClaimTemplates: 
  - metadata:
      name: mongo-data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName : mongo-gp3