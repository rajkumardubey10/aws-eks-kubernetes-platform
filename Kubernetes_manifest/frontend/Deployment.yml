apiVersion: apps/v1
kind: Deployment
metadata:
 name: frontend-deployment
 labels:
   app: frontend
spec:
 replicas: 3
 strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 1
     maxUnavailable: 0
 selector:
   matchLabels:
     app: frontend
 template:
   metadata:
     labels:
       app: frontend
   spec:
     containers:
      - name: frontend-app-image
        image: rajkumardockerhub/frontend-test:v1

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits: 
            cpu: "300m"
            memory: "256Mi"

        ports:
          - containerPort: 3000
            name: frontend-port

        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3 

        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3 

        restartPolicy: Always
        imagePullPolicy: IfNotPresent
