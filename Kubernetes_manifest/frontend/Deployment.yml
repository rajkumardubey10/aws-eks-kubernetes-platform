apiVersion: apps/v1
kind: Deployment
metadata:
 name: frontend-deployment
 labels:
   app: frontend
spec:
 replicas: 3
 strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 1
     maxUnavailable: 0
 selector:
   matchLabels:
     app: frontend
 template:
   metadata:
     labels:
       app: frontend
   spec:
     containers:
     - name: frontend-
       image: rajkumardockerhub/frontend-test:v1
       ports:
       - containerPort: 3000
 
